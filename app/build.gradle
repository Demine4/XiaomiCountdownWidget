plugins { id 'com.android.application' }

android {
    namespace 'local.countdown.probe'
    compileSdk 36
    defaultConfig {
        applicationId 'local.countdown.probe'
        minSdk 30
        targetSdk 36
        versionCode 17
        versionName '0.17.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
